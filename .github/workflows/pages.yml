name: Publish Chinese feature website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - website/**
      - docs/validation.md
      - docs/testing/jev-selection/public-results.zh-CN.md
      - docs/testing/2026-09-27-jev-hooks/public-results.zh-CN.md
      - docs/reports/2026-09-27-tool-output-admission.zh-CN.md
      - packages/jev/tests/workspace-approval-qa.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node website/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
