# One Host row owns Jev's service, Remote methods, and matching Web Client half.
- insert:
    - id: jev
      name: '@dsh-jev/plugin'
    - id: jev-selection
      name: '@dsh-jev/plugin/selection'
    - id: jev-supervision
      name: '@dsh-jev/plugin/supervision'
    - id: jev-instructions
      name: '@dsh-jev/plugin/instructions'
    - id: jev-shared-findings
      name: '@dsh-jev/plugin/shared-findings'
    - id: jev-interjection-routing
      name: '@dsh-jev/plugin/interjection'
    - id: jev-web
      name: '@dsh-jev/plugin/web'
